<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGE ADVICE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #c8c8b4;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        #terminal {
            width: 100%;
            max-width: 680px;
        }

        #buddha {
            color: #7ab8a0;
            font-size: clamp(7px, 1.6vw, 13px);
            line-height: 1.35;
            white-space: pre;
            text-shadow: 0 0 12px rgba(122, 184, 160, 0.3);
            margin-bottom: 8px;
            display: inline-block;
        }

        #wisdom-box {
            margin-top: 28px;
            min-height: 3.2em;
            padding: 0 4px;
        }

        #wisdom-text {
            color: #e8c97a;
            font-size: clamp(11px, 2.2vw, 15px);
            letter-spacing: 0.04em;
            line-height: 1.6;
            text-shadow: 0 0 16px rgba(232, 201, 122, 0.25);
            min-height: 1.6em;
            white-space: pre-wrap;
        }

        #prompt-area {
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 0;
            cursor: text;
            position: relative;
        }

        #prompt-label {
            color: #4a6a58;
            font-size: clamp(10px, 1.8vw, 13px);
            letter-spacing: 0.08em;
            user-select: none;
            margin-right: 6px;
            flex-shrink: 0;
        }

        /* invisible real input */
        #prompt-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: text;
            font-size: 16px; /* prevents iOS zoom */
        }

        /* visible fake input line */
        #prompt-display {
            color: #7ab8a0;
            font-family: inherit;
            font-size: clamp(10px, 1.8vw, 13px);
            display: flex;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        #display-text {
            white-space: pre;
        }

        /* block cursor — sits right after typed text */
        #block-cursor {
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            background: #7ab8a0;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            flex-shrink: 0;
        }

        /* typewriter cursor — same style, shown inside wisdom text */
        .tw-cursor {
            display: inline-block;
            width: 0.55em;
            height: 0.95em;
            background: #e8c97a;
            vertical-align: text-bottom;
            margin-left: 1px;
            animation: blink 0.6s step-end infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        #counter {
            margin-top: 18px;
            color: #2e4a38;
            font-size: clamp(9px, 1.4vw, 11px);
            letter-spacing: 0.12em;
        }

        #tap-hint {
            margin-top: 10px;
            color: #2e4a38;
            font-size: clamp(9px, 1.4vw, 11px);
            letter-spacing: 0.08em;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <pre id="buddha"></pre>

        <div id="wisdom-box">
            <div id="wisdom-text"></div>
        </div>

        <div id="prompt-area" onclick="focusInput()">
            <span id="prompt-label">&gt;&gt;</span>
            <div id="prompt-display">
                <span id="display-text"></span><span id="block-cursor"></span>
            </div>
            <input id="prompt-input" type="text" autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false" inputmode="text" />
        </div>

        <div id="counter">advice: 0</div>
        <div id="tap-hint">[ press enter — or tap here — type ? for categories ]</div>
    </div>

    <script>
        // ── Buddha ASCII — top/bottom are static; face lines are FSM-controlled ──────
        const BUDDHA_TOP =
            `                               _
                            _ooOoo_
                           o8888888o
                           88  .  88`;

        const BUDDHA_BOTTOM =
            `                        ____/\`---'\\____
                      .'  \\\\|     |//  \`.
                     /  \\\\|||  :  |||//  \\
                    /  _||||| -:- |||||_  \\
                    |   | \\\\\\  -  /'| |   |
                    | \\_|  \`\\:---'//  |_/ |
                    \\  .-\\__ \`-. -'__/-.  /
                  ___\`. .'  /--.--\\  \`. .'___
               .  '<  \`.___\\_<|>_/___.' _>  \`.
              | | :  \`- \\. ;\\. _/; .'/ /  .' ; |
              \\  \\ \`-.   \\_\\\\. _.'_/_/  -' _.' /
===========\`-.\`___\`-.__\\ \\___  /__.-'_.'_.-'================
                            \`=--=-'`;

        // Face lines for each state: [eyeLine, mouthLine]
        const FACES = {
            open:          [`                           (| ._. |)`, `                           O\\  -  /O`],
            blink:         [`                           (| -_- |)`, `                           O\\  -  /O`],
            sad:           [`                           (| >_< |)`, `                           O\\  ∩  /O`],
            sad_talking:   [`                           (| >_< |)`, `                           O\\  □  /O`],
            happy:         [`                           (| ^_^ |)`, `                           O\\  v  /O`],
            happy_talking: [`                           (| ^_^ |)`, `                           O\\  o  /O`],
            talking:       [`                           (| ._. |)`, `                           O\\  =  /O`],
            sleeping_01:   [`                           (| -_- |)`, `                           O\\  o  /O`],
            sleeping_02:   [`                           (| -_- |)`, `                           O\\  o  /O z`],
            sleeping_03:   [`                           (| -_- |)`, `                           O\\  O  /O zZ`],
            sleeping_04:   [`                           (| -_- |)`, `                           O\\  O  /O zZZ`],
            sleeping_05:   [`                           (| -_- |)`, `                           O\\  O  /O  zZ`],
            sleeping_06:   [`                           (| -_- |)`, `                           O\\  o  /O   z`],
        };

        const buddhaEl = document.getElementById('buddha');

        function renderFace(state) {
            const [eyeLine, mouthLine] = FACES[state] || FACES.open;
            buddhaEl.textContent =
                BUDDHA_TOP + '\n' +
                eyeLine + '\n' +
                mouthLine + '\n' +
                BUDDHA_BOTTOM;
        }

        // ── Finite State Machine ──────────────────────────────────────────────────────
        // States: idle | reacting | talking | sleeping
        // FSM owns all timers; each transition cancels previous ones cleanly.

        const WAKEUP_LINES = [
            "Sorry. Dozed off for a second. What were we talking about?",
            "Oh. Didn't see you there. Do you need sage advice? I am a sage. I give good advice.",
            "Ah! You startled me. And I am not startled easily.",
            "Hm? Oh. You're here. Good. Sit.",
            "I was not sleeping. I was meditating. Obviously.",
            "Umm... This is awkward.",
            "Were you saying something?",
        ];

        const SLEEP_TEXTS = [
            'zzzzZZZZZ',
            'zzzzzzzzZZZZZZZZ',
            'zzzzzz',
            'zzzZZZzzzzZZZ',
            'zZzZzZzZ',
            'zzzzZZzzzzZZ',
            'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz',
            'zzzzzzzzzZZZZZZZZZZZZZZZZZZZzzzzzzzzzzzzzzzzzzZZZZZZZZZZZZZ',
        ];

        const FSM = (() => {
            let blinkInterval = null;
            let talkInterval = null;
            let reactionTimer = null;
            let state = 'idle';
            let wasSleeping = false;

            function clearAll() {
                clearInterval(blinkInterval); blinkInterval = null;
                clearInterval(talkInterval); talkInterval = null;
                clearTimeout(reactionTimer); reactionTimer = null;
            }

            function startIdle() {
                clearAll();
                state = 'idle';
                renderFace('open');

                function scheduleBlink() {
                    blinkInterval = setTimeout(() => {
                        renderFace('blink');
                        blinkInterval = setTimeout(() => {
                            renderFace('open');
                            scheduleBlink();
                        }, 120);
                    }, 3500 + Math.random() * 2000);
                }
                scheduleBlink();

                // Fall asleep after 25s of inactivity
                reactionTimer = setTimeout(() => FSM.startSleeping(), 25000);
            }

            function startSleeping() {
                clearAll();
                state = 'sleeping';
                wasSleeping = true;
                typeSleep();
                const frames = ['sleeping_01', 'sleeping_02', 'sleeping_03', 'sleeping_04', 'sleeping_05', 'sleeping_06'];
                let i = 0;

                function nextFrame() {
                    renderFace(frames[i % frames.length]);
                    i++;
                    blinkInterval = setTimeout(nextFrame, 900 + Math.random() * 300);
                }
                nextFrame();
            }

            function wakeUp(onDone) {
                clearAll();
                state = 'reacting';
                wasSleeping = false;
                wisdomEl.innerHTML = '';
                let blinks = 0;
                const total = 2 + Math.floor(Math.random() * 2);

                function doBlink() {
                    if (blinks >= total) {
                        const line = WAKEUP_LINES[Math.floor(Math.random() * WAKEUP_LINES.length)];
                        typeOut(line, null, null, onDone);
                        return;
                    }
                    renderFace('blink');
                    reactionTimer = setTimeout(() => {
                        renderFace('open');
                        blinks++;
                        reactionTimer = setTimeout(doBlink, 180 + Math.random() * 120);
                    }, 120);
                }
                doBlink();
            }

            function startTalking(sentiment) {
                clearAll();
                state = 'talking';
                // Pick mouth pair based on sentiment
                const mouthClosed = sentiment === 'happy' ? 'happy' : sentiment === 'sad' ? 'sad' : 'open';
                const mouthOpen_ = sentiment === 'happy' ? 'happy_talking' : sentiment === 'sad' ? 'sad_talking' : 'talking';
                let toggle = true;
                renderFace(mouthOpen_);
                talkInterval = setInterval(() => {
                    renderFace(toggle ? mouthClosed : mouthOpen_);
                    toggle = !toggle;
                }, 160 + Math.random() * 80);
            }

            // sentiment: 'happy' | 'sad' | null  (null = no emotional pre-beat)
            function react(sentiment, onDone) {
                if (wasSleeping) { wakeUp(onDone); return; }
                clearAll();
                state = 'reacting';

                if (!sentiment) {
                    onDone();
                    return;
                }

                renderFace(sentiment);
                // Short snappy pre-beat — just enough to read, not enough to feel laggy
                reactionTimer = setTimeout(() => {
                    onDone();
                }, 250 + Math.random() * 100);
            }

            function stopTalking() {
                startIdle();
            }

            return { startIdle, startTalking, stopTalking, react, startSleeping, getState: () => state };
        })();



        // ── Tips by category ─────────────────────────────────────────────────────────
        const TIPS = {
            life: [

                "Rest days are not weakness. They are the point.",
                "Consistency beats intensity. Show up ugly.",
                "You are not tired. You are bored. Go outside.",
                "Progress is not linear. The mountain knows this.",
                "Do or do not. There is no try.",
                "Each day, a new dawn. Each rep, a new chance to grow.",
                "Do not expect a seed to bear fruit until many seasons have passed. Stop watering it, and it will bear no fruit at all.",
                "Did you drink enough water today?",
                "You are more capable than you think.",
                "The path forward begins with a single honest step.",
                "What you do in the dark builds who you are in the light.",
                "There is no spoon.",
            ],
            body: [
                "Your posture right now is terrible. Fix it.",

                "Breathe out on the effort. Every time. Always.",
                "Do not waste the animal, lest you wish to forego the gains of protein.",
                "Take your reps 70% to failure on your last burn.",
                "Stretch after every workout. I know you didn't do it last time.",
                "Eat something that grew in the ground this week.",
                "The body keeps score. Feed it accordingly.",
                "Stretch. Just once. Right now. Do it.",
                "Thank your body for all the ways it carries you.",
                "The needs of the flesh are the needs of the mind. Feed one and both grow.",
                "Movement is medicine. The dose is consistency.",
                "Rest is not surrender. It is where the body rebuilds its temple.",
                "You cannot outrun a bad diet. But you can start with one good meal.",
            ],
            mind: [
                "The needs of the flesh are the needs of the mind. Feed one and both grow.",
                "Deny your inner critic a voice.",
                "Consistency beats intensity. Show up ugly.",
                "Progress is not linear. The mountain knows this.",
                "The Buddha was jacked. Probably. No one checked.",
                "You are not tired. You are bored. Go outside.",
                "Silence is not emptiness. It is where thought becomes clear.",
                "The mind that is still can hear what the noise drowns out.",
                "Discipline is not punishment. It is the highest form of self-respect.",
                "What you feed your attention, you feed your life.",
                "Worry is the interest paid on trouble not yet owed.",
                "Read. Think. Then act. In that order.",

            ],
            heart: [
                "Thank your body for all the ways it carries you.",
                "You are more capable than you think.",
                "Each day, a new dawn. Each rep, a new chance to grow.",
                "The mountain does not rush. Neither should your reps.",
                "What you love, tend carefully. It will tend you in return.",
                "Grief is love with nowhere to go. Give it somewhere.",

                "Tabata: 20 sec on, 10 sec off, 8 rounds. Pick one: burpees, mountain climbers, or jump rope.",

                "Pull day! 10x3 superset: db romanian deadlift, db gorilla rows, bicep curls. 60-90 sec rest between sets.",
                "Pull day! 10x3 superset: lat pulldown or assisted pull up, cable machine face pulls, cable reverse flyes. rest 60-90 sec between sets.",
            ],
            mom: [
                "You cannot pour from an empty cup. Fill yours first, without guilt.",
                "The dishes have waited before. They will wait again. Sleep.",
                "You do not bounce back. You grow forward. There is a difference.",
                "Tummy time every day. Resistance is part of the work. For both of you.",
                "Before any core work, learn to breathe again. The breath is the foundation of the foundation.",
                "Drink water. More than that. More.",
                "Help does not arrive uninvited. Open the door. Say the words.",
                "A fed, dry, held baby may still cry. So may you. Both are allowed.",
                "The mental load does not announce itself. Name it anyway. Then share it.",
                "The pelvic floor holds everything together. Tend to it first. See a specialist.",

                "You are not failing. You are in the fire that forges every parent who ever lived.",
                "The baby does not need a perfect mother. The baby needs its mother.",
                "If the fatigue runs deep and the food is good, check your iron. Check your protein. The temple needs tending.",
                "A walk outside, even a brief one, is the oldest medicine on this mountain.",
                "You will not feel like yourself for a while. That self is not gone. She is becoming.",
            ],
            momworkout: [
                "Cat cow. Child's pose. Supported bridge. Ten minutes of gentle movement is still movement.",
                "Three sets of glute bridges while the baby sleeps. That is enough. Do not let anyone tell you otherwise.",
                "Nerve glides and cobra pose. Simple, yet effective.",
                "Ten minutes walking with the stroller is ten minutes. The mountain does not measure distance.",
            ],
            joke: [
                "Why didn't Buddha vacuum the corners? Because he had no attachments.",
                "Did you know Buddha was a coroner? He got fired because he kept marking deaths as 'birth'.",
                "The monastery down the street is hiring! How do I know? They have a sign on the door, says 'inquire within'.",
                "How many Zen buddhists does it take to change a light bulb? Three -- one to change it, one to not-change it and one to both change- and not-change it.",
                "How many vipassana meditators does it take to change a light bulb? None. They simply chant 'Darkness. Darkness. Darkness...'.",
                "On his birthday, Buddha was given a gift in a box tied with a ribbon. He opened it up to find it empty. 'Just what I wanted!' he declared, 'Nothing!'",
                "The Dalai Lama goes into a pizza shop and says, 'Make me one with everything.'",
                "Forget the past you cannot change it. Forget the future you cannot predict it. Forget the present, I didn't get you one.",
                "The Academy Zen Awards had some amazing speeches. Almost every award winner said 'Thanks for Nothing.'",
            ]
        };

        const ALL_CATEGORIES = ['life', 'body', 'mind', 'heart', 'joke', 'workout'];



        const RUDE_TRIGGERS = new Set([
            'fuck', 'fuck you', 'shit', 'ass', 'asshole', 'bitch', 'bastard',
            'idiot', 'stupid', 'dumb', 'hate', 'nerd', 'loser', 'shut up',
            'stfu', 'wtf', 'whatever', 'crap', 'damn', 'hell', 'moron', 'ugly',
            'die', 'kill', 'suck', 'sucks', 'trash', 'garbage', 'lame',
        ]);

        const GREETING_TRIGGERS = new Set([
            'hello', 'hi', 'hey', 'greetings', 'howdy', 'sup', 'yo',
            'good morning', 'good evening', 'good afternoon',
            'namaste', 'salutations', 'hail', 'hiya', 'heya', 'wassup', 'what up',
            'aloha', 'hola', 'konichiwa', 'bonjour',
        ]);

        const HELP_TEXT =
            `categories:
      life  — how to live
      body  — how to move and eat
      mind  — how to think
      heart — how to feel
      joke — random joke
      workout — random workout

type a category and press enter.
press enter alone for random wisdom.`;

        // ── No-repeat buffer per category ────────────────────────────────────────────
        const BUFFER_SIZE = 5;
        const recentByCategory = {};

        function pickFrom(category) {
            const pool = TIPS[category];
            if (!recentByCategory[category]) recentByCategory[category] = [];
            const recent = recentByCategory[category];
            let idx, attempts = 0;
            do {
                idx = Math.floor(Math.random() * pool.length);
                attempts++;
            } while (recent.includes(idx) && attempts < 40);
            recent.push(idx);
            if (recent.length > BUFFER_SIZE) recent.shift();
            return pool[idx];
        }

        function pickRandom() {
            const cat = ALL_CATEGORIES[Math.floor(Math.random() * ALL_CATEGORIES.length)];
            return pickFrom(cat);
        }

        // Returns { type, text, sentiment }
        // sentiment: 'happy' | 'sad' | null
        function resolveInput(raw) {
            const trimmed = raw.trim().toLowerCase();
            if (trimmed === '?' || trimmed === 'help') return { type: 'help', sentiment: null };
            const s = trimmed.replace(/[^a-z0-9 ]/g, '');

            if (GREETING_TRIGGERS.has(s)) {
                return { type: 'tip', text: pickFrom('greeting'), sentiment: 'happy' };
            }
            if ([...RUDE_TRIGGERS].some(t => s.includes(t))) {
                return { type: 'tip', text: pickFrom('rude'), sentiment: 'sad' };
            }
            if (s === 'joke') {
                return { type: 'tip', text: pickFrom('joke'), sentiment: 'happy' };
            }
            if (s === 'sleep') {
                return { type: 'sleep', sentiment: null };
            }
            if (ALL_CATEGORIES.includes(s) || s === 'mom' || s === 'momworkout') {
                return { type: 'tip', text: pickFrom(s), sentiment: null };
            }
            return { type: 'tip', text: pickRandom(), sentiment: null };
        }

        // ── Typewriter with FSM integration ──────────────────────────────────────────
        const wisdomEl = document.getElementById('wisdom-text');
        let typeTimer = null;

        function typeOut(text, color, sentiment, onDone) {
            clearTimeout(typeTimer);
            wisdomEl.innerHTML = '';
            wisdomEl.style.color = color || '#e8c97a';

            const full = '>> ' + text;
            let i = 0;

            // Start talking animation with emotional mouth
            FSM.startTalking(sentiment);

            function tick() {
                const typed = full.slice(0, i);
                wisdomEl.innerHTML =
                    typed.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                    '<span class="tw-cursor"></span>';
                if (i <= full.length) {
                    i++;
                    typeTimer = setTimeout(tick, 24 + Math.random() * 24);
                } else {
                    // Typewriter done — remove cursor, return to idle
                    wisdomEl.innerHTML = typed.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    FSM.stopTalking();
                    if (onDone) onDone();
                }
            }
            tick();
        }

        function typeSleep() {
            clearTimeout(typeTimer);
            wisdomEl.style.color = '#e8c97a';
            wisdomEl.innerHTML = '';
            const full = '>> ' + SLEEP_TEXTS[Math.floor(Math.random() * SLEEP_TEXTS.length)]
            let i = 0;

            function tick() {
                if (FSM.getState() !== 'sleeping') return;
                wisdomEl.innerHTML = full.slice(0, i)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                    '<span class="tw-cursor"></span>';
                if (i <= full.length) {
                    i++;
                    typeTimer = setTimeout(tick, 80 + Math.random() * 60);
                } else {
                    typeTimer = setTimeout(() => {
                        wisdomEl.innerHTML = '';
                        typeTimer = setTimeout(typeSleep, 600);
                    }, 1200);
                }
            }
            tick();
        }

        function typeHelp(text) {
            clearTimeout(typeTimer);
            wisdomEl.style.color = '#7ab8a0';
            wisdomEl.innerHTML = '';
            const lines = text.split('\n');
            let lineIdx = 0, charIdx = 0;

            FSM.startTalking(null);

            function tick() {
                if (lineIdx >= lines.length) {
                    wisdomEl.innerHTML = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    FSM.stopTalking();
                    return;
                }
                const soFar = lines.slice(0, lineIdx).join('\n') +
                    (lineIdx > 0 ? '\n' : '') +
                    lines[lineIdx].slice(0, charIdx);
                wisdomEl.innerHTML =
                    soFar.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                    '<span class="tw-cursor"></span>';
                charIdx++;
                if (charIdx > lines[lineIdx].length) { lineIdx++; charIdx = 0; }
                typeTimer = setTimeout(tick, 18 + Math.random() * 14);
            }
            tick();
        }

        // ── Prompt display (fake visible input) ──────────────────────────────────────
        const displayText = document.getElementById('display-text');
        const input = document.getElementById('prompt-input');
        const counterEl = document.getElementById('counter');
        const tapHint = document.getElementById('tap-hint');

        let count = 0;

        input.addEventListener('input', () => {
            displayText.textContent = input.value;
        });

        function focusInput() { input.focus(); }

        function submit() {
            const raw = input.value;
            input.value = '';
            displayText.textContent = '';
            if (FSM.getState() === 'sleeping') {
                count++;
                counterEl.textContent = `advice: ${count}`;
                FSM.react(null, () => { });
                return;
            }

            const result = resolveInput(raw);
            count++;
            counterEl.textContent = `advice: ${count}`;

            // React first (emotional pre-beat), then type
            FSM.react(result.sentiment, () => {
                if (result.type === 'help') {
                    typeHelp(HELP_TEXT);
                } else if (result.type === 'sleep') {
                    FSM.startSleeping();
                } else {
                    typeOut(result.text, null, result.sentiment);
                }
            });
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); submit(); }
        });

        tapHint.addEventListener('click', () => {
            if (input.value.trim() === '') {
                const result = resolveInput('');
                count++;
                counterEl.textContent = `advice: ${count}`;
                FSM.react(result.sentiment, () => typeOut(result.text, null, result.sentiment));
            } else {
                submit();
            }
        });

        document.getElementById('prompt-area').addEventListener('click', focusInput);

        window.addEventListener('load', () => {
            FSM.startSleeping()
            setTimeout(focusInput, 100);
        });

    </script>
</body>
</html>
