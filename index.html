<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddha Mountain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #c8c8b4;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  #terminal {
    width: 100%;
    max-width: 680px;
  }

  #buddha {
    color: #7ab8a0;
    font-size: clamp(7px, 1.6vw, 13px);
    line-height: 1.35;
    white-space: pre;
    text-shadow: 0 0 12px rgba(122, 184, 160, 0.3);
    margin-bottom: 8px;
    display: inline-block;
  }

  #mountain-line {
    color: #4a7a60;
    font-size: clamp(7px, 1.6vw, 13px);
    white-space: pre;
    text-shadow: 0 0 8px rgba(74, 122, 96, 0.4);
  }

  #wisdom-box {
    margin-top: 28px;
    min-height: 3.2em;
    padding: 0 4px;
  }

  #wisdom-text {
    color: #e8c97a;
    font-size: clamp(11px, 2.2vw, 15px);
    letter-spacing: 0.04em;
    line-height: 1.6;
    text-shadow: 0 0 16px rgba(232, 201, 122, 0.25);
    min-height: 1.6em;
    white-space: pre-wrap;
  }

  #prompt-area {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 0;
    cursor: text;
    position: relative;
  }

  #prompt-label {
    color: #4a6a58;
    font-size: clamp(10px, 1.8vw, 13px);
    letter-spacing: 0.08em;
    user-select: none;
    margin-right: 6px;
    flex-shrink: 0;
  }

  /* invisible real input */
  #prompt-input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    cursor: text;
    font-size: 16px; /* prevents iOS zoom */
  }

  /* visible fake input line */
  #prompt-display {
    color: #7ab8a0;
    font-family: inherit;
    font-size: clamp(10px, 1.8vw, 13px);
    display: flex;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  #display-text {
    white-space: pre;
  }

  /* block cursor — sits right after typed text */
  #block-cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: #7ab8a0;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
    flex-shrink: 0;
  }

  /* typewriter cursor — same style, shown inside wisdom text */
  .tw-cursor {
    display: inline-block;
    width: 0.55em;
    height: 0.95em;
    background: #e8c97a;
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: blink 0.6s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  #counter {
    margin-top: 18px;
    color: #2e4a38;
    font-size: clamp(9px, 1.4vw, 11px);
    letter-spacing: 0.12em;
  }

  #tap-hint {
    margin-top: 10px;
    color: #2e4a38;
    font-size: clamp(9px, 1.4vw, 11px);
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
  }
</style>
</head>
<body>

<div id="terminal">
  <pre id="buddha"></pre>
  <pre id="mountain-line">===========`-.`___`-.__\ \___  /__.-'_.'_.-'================
                        `=--=-'</pre>

  <div id="wisdom-box">
    <div id="wisdom-text"></div>
  </div>

  <div id="prompt-area" onclick="focusInput()">
    <span id="prompt-label">&gt;&gt;</span>
    <div id="prompt-display">
      <span id="display-text"></span><span id="block-cursor"></span>
    </div>
    <input id="prompt-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" inputmode="text" />
  </div>

  <div id="counter">presses: 0</div>
  <div id="tap-hint">[ press enter — or tap here — type ? for categories ]</div>
</div>

<script>
// ── Buddha ASCII frames (eyes open / eyes closed = blink) ────────────────────
const FRAME_OPEN =
`                           _
                        _ooOoo_
                       o8888888o
                       88  .  88
                       (| ._. |)
                       O\\  =  /O
                    ____/\`---'\\____
                  .'  \\\\|     |//  \`.
                 /  \\\\|||  :  |||//  \\
                /  _||||| -:- |||||_  \\
                |   | \\\\\\  -  /'| |   |
                | \\_|  \`\\:---'//  |_/ |
                \\  .-\\__ \`-. -'__/-.  /
              ___\`. .'  /--.--\\  \`. .'___
           .  '<  \`.___\\_<|>_/___.' _>  \`.
          | | :  \`- \\. ;\\. _/; .'/ /  .' ; |
          \\  \\ \`-.   \\_\\\\. _.'_/_/  -' _.' /`;

const FRAME_BLINK =
`                           _
                        _ooOoo_
                       o8888888o
                       88  .  88
                       (| -_- |)
                       O\\  =  /O
                    ____/\`---'\\____
                  .'  \\\\|     |//  \`.
                 /  \\\\|||  :  |||//  \\
                /  _||||| -:- |||||_  \\
                |   | \\\\\\  -  /'| |   |
                | \\_|  \`\\:---'//  |_/ |
                \\  .-\\__ \`-. -'__/-.  /
              ___\`. .'  /--.--\\  \`. .'___
           .  '<  \`.___\\_<|>_/___.' _>  \`.
          | | :  \`- \\. ;\\. _/; .'/ /  .' ; |
          \\  \\ \`-.   \\_\\\\. _.'_/_/  -' _.' /`;

const buddhaEl = document.getElementById('buddha');
buddhaEl.textContent = FRAME_OPEN;

// blink every ~4 seconds, hold closed for 120ms
function scheduleBlink() {
  const delay = 3500 + Math.random() * 2000;
  setTimeout(() => {
    buddhaEl.textContent = FRAME_BLINK;
    setTimeout(() => {
      buddhaEl.textContent = FRAME_OPEN;
      scheduleBlink();
    }, 120);
  }, delay);
}
scheduleBlink();

// ── Tips by category ─────────────────────────────────────────────────────────
const TIPS = {
  life: [
    "Drink water. Not coffee. Water.",
    "The mountain does not rush. Neither should your reps.",
    "Sleep is the workout you forgot to schedule.",
    "Walk barefoot on grass. Touch some dirt. Be normal.",
    "Eat something that grew in the ground this week.",
    "Rest days are not weakness. They are the point.",
    "Consistency beats intensity. Show up ugly.",
    "You are not tired. You are bored. Go outside.",
    "Progress is not linear. The mountain knows this.",
    "Do or do not. There is no try.",
    "Each day, a new dawn. Each rep, a new chance to grow.",
    "Do not expect a seed to bear fruit until many seasons have passed. Stop watering it, and it will bear no fruit at all.",
    "Did you drink enough water today?",
    "You are more capable than you think.",
    "The path forward begins with a single honest step.",
    "What you do in the dark builds who you are in the light.",
  ],
  body: [
    "Your posture right now is terrible. Fix it.",
    "Lift heavy things. Put them down. Repeat until wise.",
    "Breathe out on the effort. Every time. Always.",
    "Do not waste the animal, lest you wish to forego the gains of protein.",
    "Take your reps 70% to failure on your last burn.",
    "Stretch after every workout. I know you didn't do it last time.",
    "Eat something that grew in the ground this week.",
    "The body keeps score. Feed it accordingly.",
    "Stretch. Just once. Right now. Do it.",
    "Thank your body for all the ways it carries you.",
    "The needs of the flesh are the needs of the mind. Feed one and both grow.",
    "Movement is medicine. The dose is consistency.",
    "Rest is not surrender. It is where the body rebuilds its temple.",
    "You cannot outrun a bad diet. But you can start with one good meal.",
  ],
  mind: [
    "The needs of the flesh are the needs of the mind. Feed one and both grow.",
    "Deny your inner critic a voice.",
    "Consistency beats intensity. Show up ugly.",
    "Progress is not linear. The mountain knows this.",
    "The Buddha was jacked. Probably. No one checked.",
    "You are not tired. You are bored. Go outside.",
    "Silence is not emptiness. It is where thought becomes clear.",
    "The mind that is still can hear what the noise drowns out.",
    "Discipline is not punishment. It is the highest form of self-respect.",
    "What you feed your attention, you feed your life.",
    "Worry is the interest paid on trouble not yet owed.",
    "Read. Think. Then act. In that order.",
    "The sharpest tool you own lives between your ears. Use it.",
  ],
  heart: [
    "Thank your body for all the ways it carries you.",
    "You are more capable than you think.",
    "Each day, a new dawn. Each rep, a new chance to grow.",
    "The mountain does not rush. Neither should your reps.",
    "What you love, tend carefully. It will tend you in return.",
    "Grief is love with nowhere to go. Give it somewhere.",
    "Connection is not a weakness. It is the whole point.",
    "Be gentle with yourself on the hard days. The mountain has hard days too.",
    "Forgiveness is not absolution. It is putting down a weight you were never meant to carry.",
    "Tell the people who matter that they matter. Today. Not eventually.",
    "Joy is not frivolous. It is evidence you are alive.",
    "Do not let the noise of others drown out your own quiet knowing.",
  ],
  rude: [
    "The stone that is thrown in anger lands on the thrower first.",
    "Hostility is a wall. It keeps others out, but it also keeps you in.",
    "The mouth speaks what the heart is full of. What is yours full of today?",
    "Anger is fire. Useful for warmth. Dangerous when you live inside it.",

  ],
  greeting: [
    "You have arrived. That is already something.",

    "Hello. The mountain does not wave back. But it notices.",

    "Namaste. The light in me sees the light in you. How are your knees?",
    "Oh good, you're here. The mountain was getting lonely. It won't admit that.",

    "You typed hello into a terminal with a Buddha on it. We are both doing our best.",
    "Ah, a visitor. The enlightenment is loading. Please wait.",
    "Hi. Pull up a boulder. Stay awhile. There is nowhere to be.",
  ],
  workout: [
    "Push day! 10x3 superset: kettlebell squats, kettlebell side lunges, eccentric single-leg calf raises. 60-90 sec rest between sets.",
    "Push Day! 10x3 superset: bulgarian split squat, db chest press, db bench flyes. 60-90 sec rest between sets.",
    "1 mile run/jog to warm up, track workout 3x 400 meter sprints, 100 meter walk between sprints to cool down.",
    "Yoga flow- child's pose, cat cow, down dog, warrior 2, reverse warrior, tree pose, vinyasa, repeat other side.",
    "Try rock climbing.",
    "AMRAP 15 min: 10 push-ups, 15 air squats, 20 jumping jacks. Rest only when you must.",
    "Tabata: 20 sec on, 10 sec off, 8 rounds. Pick one: burpees, mountain climbers, or jump rope.",
    "Active recovery day: 20 min easy cardio, then 10 min full body stretch",
    "Pull day! 10x3 superset: db romanian deadlift, db gorilla rows, bicep curls. 60-90 sec rest between sets.",
    "Pull day! 10x3 superset: lat pulldown or assisted pull up, cable machine face pulls, cable reverse flyes. rest 60-90 sec between sets.",
};

const ALL_CATEGORIES = ['life', 'body', 'mind', 'heart', 'workout'];

const RUDE_TRIGGERS = new Set([
  'fuck', 'fuck you', 'shit', 'ass', 'asshole', 'bitch', 'bastard',
  'idiot', 'stupid', 'dumb', 'hate', 'nerd', 'loser', 'shut up',
  'stfu', 'wtf', 'whatever', 'crap', 'damn', 'hell', 'moron', 'ugly',
  'die', 'kill', 'suck', 'sucks', 'trash', 'garbage', 'lame',
]);

const GREETING_TRIGGERS = new Set([
  'hello', 'hi', 'hey', 'greetings', 'howdy', 'sup', 'yo',
  'good morning', 'good evening', 'good afternoon',
  'namaste', 'salutations', 'hail', 'hiya', 'heya', 'wassup', 'what up',
]);

const HELP_TEXT =
`categories:
  life  — how to live
  body  — how to move and eat
  mind  — how to think
  heart — how to feel
  workout — random workout for you to try

type a category and press enter.
press enter alone for random wisdom.`;

// ── No-repeat buffer per category ────────────────────────────────────────────
const BUFFER_SIZE = 5;
const recentByCategory = {};

function pickFrom(category) {
  const pool = TIPS[category];
  if (!recentByCategory[category]) recentByCategory[category] = [];
  const recent = recentByCategory[category];
  let idx, attempts = 0;
  do {
    idx = Math.floor(Math.random() * pool.length);
    attempts++;
  } while (recent.includes(idx) && attempts < 40);
  recent.push(idx);
  if (recent.length > BUFFER_SIZE) recent.shift();
  return pool[idx];
}

function pickRandom() {
  const cat = ALL_CATEGORIES[Math.floor(Math.random() * ALL_CATEGORIES.length)];
  return pickFrom(cat);
}

function resolveInput(raw) {
  const s = raw.trim().toLowerCase();
  if (s === '?') return { type: 'help' };
  if (GREETING_TRIGGERS.has(s)) {                          // ← greeting FIRST
    return { type: 'tip', text: pickFrom('greeting') };
  }
  if ([...RUDE_TRIGGERS].some(t => s.includes(t))) {       // ← rude second
    return { type: 'tip', text: pickFrom('rude') };
  }
  if (ALL_CATEGORIES.includes(s)) {
    return { type: 'tip', text: pickFrom(s) };
  }
  return { type: 'tip', text: pickRandom() };
}

// ── Typewriter with block cursor ──────────────────────────────────────────────
const wisdomEl = document.getElementById('wisdom-text');
let typeTimer = null;

function typeOut(text, color) {
  clearTimeout(typeTimer);
  wisdomEl.innerHTML = '';
  wisdomEl.style.color = color || '#e8c97a';

  const full = '>> ' + text;
  let i = 0;

  function tick() {
    // render typed chars + cursor block
    const typed = full.slice(0, i);
    wisdomEl.innerHTML =
      typed.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
      '<span class="tw-cursor"></span>';
    if (i <= full.length) {
      i++;
      typeTimer = setTimeout(tick, 24 + Math.random() * 24);
    } else {
      // remove cursor when done
      wisdomEl.innerHTML = typed.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  }
  tick();
}

function typeHelp(text) {
  clearTimeout(typeTimer);
  wisdomEl.style.color = '#7ab8a0';
  wisdomEl.innerHTML = '';
  const lines = text.split('\n');
  let lineIdx = 0, charIdx = 0;

  function tick() {
    if (lineIdx >= lines.length) {
      wisdomEl.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return;
    }
    const soFar = lines.slice(0, lineIdx).join('\n') +
                  (lineIdx > 0 ? '\n' : '') +
                  lines[lineIdx].slice(0, charIdx);
    wisdomEl.innerHTML =
      soFar.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
      '<span class="tw-cursor"></span>';
    charIdx++;
    if (charIdx > lines[lineIdx].length) { lineIdx++; charIdx = 0; }
    typeTimer = setTimeout(tick, 18 + Math.random() * 14);
  }
  tick();
}

// ── Prompt display (fake visible input) ──────────────────────────────────────
const displayText = document.getElementById('display-text');
const input       = document.getElementById('prompt-input');
const counterEl   = document.getElementById('counter');
const tapHint     = document.getElementById('tap-hint');

let count = 0;

input.addEventListener('input', () => {
  displayText.textContent = input.value;
});

function focusInput() { input.focus(); }

function submit() {
  const raw = input.value;
  const result = resolveInput(raw);
  input.value = '';
  displayText.textContent = '';
  count++;
  counterEl.textContent = `presses: ${count}`;

  if (result.type === 'help') {
    typeHelp(HELP_TEXT);
  } else {
    typeOut(result.text);
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
});

tapHint.addEventListener('click', () => {
  if (input.value.trim() === '') {
    // treat tap with no text as random
    const result = resolveInput('');
    count++;
    counterEl.textContent = `presses: ${count}`;
    typeOut(result.text);
  } else {
    submit();
  }
});

document.getElementById('prompt-area').addEventListener('click', focusInput);

window.addEventListener('load', () => { setTimeout(focusInput, 100); });
</script>
</body>
</html>
